# ════════════════════════════════════════════════════════════════════════════
# analysis_options.yaml
#
# قواعد Lint صارمة لمشروع DT.Teeth.
# القرار 17 من الملف التقني: Performance & Clean Code.
#
# الهدف: منع الأخطاء قبل الـ Build، وتوحيد أسلوب الكتابة عبر الفريق.
# ════════════════════════════════════════════════════════════════════════════

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # رفع التحذيرات لأخطاء — يمنع الدمج على main بدون تصحيح.
    invalid_annotation_target: ignore
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # ── Performance (القرار 17) ─────────────────────────────────────────
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true

    # ── Clean Code ──────────────────────────────────────────────────────
    avoid_print: true
    prefer_single_quotes: true
    require_trailing_commas: true
    always_declare_return_types: true
    prefer_final_fields: true
    prefer_final_locals: true
    unnecessary_late: true
    use_super_parameters: true

    # ── Style ──────────────────────────────────────────────────────────
    camel_case_types: true
    file_names: true
    constant_identifier_names: false # نسمح بـ ALL_CAPS في الثوابت
    non_constant_identifier_names: true
    package_prefixed_library_names: false

    # ── Safety ─────────────────────────────────────────────────────────
    avoid_catches_without_on_clauses: false # نسمح لأنه مفيد في DI و Storage
    avoid_catching_errors: true
    use_build_context_synchronously: true
    close_sinks: true
    cancel_subscriptions: true

    # ── تعطيل قواعد متشددة بدون فائدة ──────────────────────────────────
    public_member_api_docs: false # لا حاجة لكل عضو عام يحتاج توثيق
    lines_longer_than_80_chars: false # نسمح بأسطر أطول لوضوح العربية
