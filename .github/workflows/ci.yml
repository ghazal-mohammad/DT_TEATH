name: CI

# فحص + اختبار على كل دفعة/طلب دمج — يمنع تسرّب الأخطاء والتحذيرات.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ملاحظة: لا نفرض dart format لأن أسلوب الفريق الحالي متّسق ويختلف عن
      # المنسّق الافتراضي؛ البوّابتان الفعليّتان هما التحليل والاختبارات.
      - name: Analyze (fails on any warning/error)
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded
